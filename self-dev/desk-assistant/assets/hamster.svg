<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <!-- 仓鼠应用图标 -->
  <!-- 耳朵外 -->
  <ellipse cx="32" cy="32" rx="10" ry="12" fill="#b88660"/>
  <ellipse cx="68" cy="32" rx="10" ry="12" fill="#b88660"/>
  <!-- 耳朵内 -->
  <ellipse cx="32" cy="34" rx="5" ry="6.5" fill="#f4c2a1"/>
  <ellipse cx="68" cy="34" rx="5" ry="6.5" fill="#f4c2a1"/>

  <!-- 身体 -->
  <circle cx="50" cy="58" r="34" fill="#d4a373"/>

  <!-- 脸（更浅色椭圆） -->
  <ellipse cx="50" cy="64" rx="24" ry="21" fill="#f4d2b3"/>

  <!-- 腮红 -->
  <circle cx="28" cy="70" r="5" fill="#f4a8a8" opacity="0.55"/>
  <circle cx="72" cy="70" r="5" fill="#f4a8a8" opacity="0.55"/>

  <!-- 眼睛 -->
  <circle cx="40" cy="58" r="4.5" fill="#1a1a1a"/>
  <circle cx="60" cy="58" r="4.5" fill="#1a1a1a"/>
  <!-- 眼睛高光 -->
  <circle cx="41.5" cy="56" r="1.6" fill="#ffffff"/>
  <circle cx="61.5" cy="56" r="1.6" fill="#ffffff"/>

  <!-- 鼻子 -->
  <ellipse cx="50" cy="68" rx="2.8" ry="2.2" fill="#8b3a3a"/>

  <!-- 嘴（双曲线笑） -->
  <path d="M50 70.5 Q46 75 42 73.5" stroke="#5d2f1a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M50 70.5 Q54 75 58 73.5" stroke="#5d2f1a" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- 胡须 -->
  <line x1="25" y1="68" x2="34" y2="69" stroke="#6b4a30" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="25" y1="72" x2="34" y2="71.5" stroke="#6b4a30" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="66" y1="69" x2="75" y2="68" stroke="#6b4a30" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="66" y1="71.5" x2="75" y2="72" stroke="#6b4a30" stroke-width="0.8" stroke-linecap="round"/>

  <!-- 两颗小门牙 -->
  <rect x="48.4" y="72.5" width="1.6" height="3" rx="0.5" fill="#ffffff"/>
  <rect x="50" y="72.5" width="1.6" height="3" rx="0.5" fill="#ffffff"/>
</svg>
